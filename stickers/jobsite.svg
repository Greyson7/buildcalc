<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- white background, best for print + QR contrast -->
  <rect width="900" height="900" fill="#ffffff"/>

  <!-- audience indicator band (gray/blue/orange) -->
  <rect x="0" y="0" width="900" height="70" fill="#0c0f14"/>
  <g transform="translate(275 105) scale(0.16) translate(-116 -108)">
    <path fill="#ff7a1a" d="M116 396 L116 324 L188 324 L188 252 L260 252 L260 180 L332 180 L332 108 L404 108 L404 396 Z"/>
    <rect x="116" y="404" width="288" height="20" rx="10" fill="#3b9eff"/>
  </g>
  <text x="355" y="167" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#0c0f14" letter-spacing="-1">BuildCalc</text>

  <!-- headline: line 1 in ink, line 2 in band color (visual tie-back) -->
  <text x="450" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#0c0f14" letter-spacing="-2">NO SIGNAL.</text>
  <text x="450" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#ff7a1a" letter-spacing="-2">NO PROBLEM.</text>

  <!-- QR with a thin frame so it reads as a tappable target -->
  <rect x="246" y="366" width="408" height="408" rx="12" fill="#ffffff" stroke="#0c0f14" stroke-width="3"/>
  <image x="260" y="380" width="380" height="380" href="data:image/png;base64,"/>

  <!-- sub copy below QR -->
  <text x="450" y="810" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#374151">Stairs, concrete, decking, rafters — full construction math, free, offline.</text>

  <!-- footer band in brand orange with domain in white -->
  <rect x="0" y="840" width="900" height="60" fill="#ff7a1a"/>
  <text x="450" y="879.3333333333334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">buildprocalc.com</text>
</svg>