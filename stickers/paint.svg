<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- white background, best for print + QR contrast -->
  <rect width="600" height="600" fill="#ffffff"/>

  <!-- audience indicator band (gray/blue/orange) -->
  <rect x="0" y="0" width="600" height="22" fill="#1d4ed8"/>

  <!-- headline: line 1 in ink, line 2 in band color (visual tie-back) -->
  <text x="300" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#0c0f14" letter-spacing="-2">HOW MANY</text>
  <text x="300" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#1d4ed8" letter-spacing="-2">GALLONS?</text>

  <!-- QR with a thin frame so it reads as a tappable target -->
  <rect x="142" y="167" width="316" height="316" rx="12" fill="#ffffff" stroke="#0c0f14" stroke-width="2"/>
  <image x="150" y="175" width="300" height="300" href="data:image/png;base64,"/>

  <!-- sub copy below QR -->
  <text x="300" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">Free paint calculator. Works offline.</text>

  <!-- footer band in brand orange with domain in white -->
  <rect x="0" y="554" width="600" height="46" fill="#ff7a1a"/>
  <text x="300" y="584.3333333333334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1">buildprocalc.com</text>
</svg>