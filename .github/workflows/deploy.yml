# Builds the static site and publishes it to the gh-pages branch on every
# push to main. GitHub Pages serves gh-pages at buildprocalc.com, so with this
# in place a push to main is all it takes to go live — no manual build step.
#
# Can also be run by hand from the repo's Actions tab (workflow_dispatch).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job needs write access to push the built site to the gh-pages branch.
# This per-workflow grant works even though the repo default is read-only.
permissions:
  contents: write

# One deploy at a time; if a newer push lands mid-run, drop the older run.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_* vars must be present at build time — Next.js inlines
        # them into the static bundle. Without this, the waitlist form has no
        # endpoint to POST to and falls back to the email-us error path.
        env:
          NEXT_PUBLIC_WAITLIST_ENDPOINT: ${{ secrets.NEXT_PUBLIC_WAITLIST_ENDPOINT }}
        run: npm run build

      - name: Publish ./out to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # ./out already contains CNAME and .nojekyll (copied from public/),
          # so the custom domain and /_next asset paths survive the deploy.
